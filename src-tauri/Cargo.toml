[package]
name = "lode"
version = "0.1.0"
description = "A minimal, fast desktop Git client"
authors = ["Lode Contributors"]
edition = "2021"
default-run = "lode"

[[bin]]
name = "lode"
path = "src/main.rs"

[[bin]]
name = "rebase_helper"
path = "src/bin/rebase_helper.rs"

[lib]
name = "lode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.43.0", features = ["full"] }
thiserror = "=2.0.11"
notify = "=8.0.0"
ignore = "=0.4.23"
ts-rs = { version = "=10.1.0", features = ["serde-compat"] }
tempfile = "=3.17.1"

[dev-dependencies]
tempfile = "=3.17.1"
