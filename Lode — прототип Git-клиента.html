F=F.filter(f=>!inS(f));hs=[false,false];msg='';amend=false;sel=0;if(!F.find(f=>f.n==cur))cur=F[0]?F[0].n:'';toast(a?'Коммит изменён':'Коммит создан: '+t);render()}
function conf(){if(!mg)return '<div class="em">Конфликтов нет. Репозиторий в обычном состоянии.</div>';
const f=CF[cfi],m=op=='merge',L1=m?'Текущая ветка (main)':'Основа (origin/main)',L2=m?'Вливаемая (feature/diff-view)':'Ваш коммит 7be02d4',
bt=(k,t)=>`<button ${f.ok?'disabled':''} class="${f.r==k?'p':''}" onclick="CF[cfi].r='${k}';render()">${t}</button>`,
mkb=`<button class="p" ${f.r&&!f.ok?'':'disabled'} onclick="mk()">${f.ok?'Решён':'Отметить решённым'}</button>`,
sl=`<select onchange="op=this.value;render()"><option value="merge" ${m?'selected':''}>merge</option><option value="rebase" ${m?'':'selected'}>rebase</option></select>`,
ls=`<div class="cl">${CF.map((c,i)=>`<div class="f ${i==cfi?'on':''}" onclick="cfi=${i};render()"><span class="st ${c.ok?'A':'D'}">${c.ok?'✓':'!'}</span><span class="mono ell">${c.n}</span><span class="chip t">${c.t}</span></div>`).join('')}<div class="mut" style="padding:10px 8px;font-size:12px">${m?'При merge «левое» — это текущая ветка.':'При rebase стороны меняются местами. Подписи подстраиваются, чтобы вы не выбрали не ту.'}</div></div>`;
if(f.t=='DU')return ls+`<div class="col" style="flex:1"><div class="bar"><b class="mono">${f.n}</b><span class="chip t">DU</span><span class="sp"></span>${bt('keep','Оставить файл')}${bt('del','Удалить файл')}${mkb}</div><div class="pad"><p>Удалён: <b>${L1}</b>. Изменён: <b>${L2}</b>. Выберите, что сделать с файлом.</p><pre class="pv mono">+ export function runGit(args: string[]) {\n+   return spawn("git", args, { windowsHide: true });\n+ }</pre><p class="mut">${f.r=='keep'?'Файл будет сохранён с изменениями из второй стороны.':f.r=='del'?'Файл будет удалён (git rm).':'Решение не выбрано.'}</p></div></div>`;
const O=['const timeout = 5000;',"return run(['status','--porcelain=v2'], { timeout });"],T=['const timeout = cfg.gitTimeout;',"return run(['status','-z'], { timeout, cwd });"],r=f.r,ch=r=='a'?O:r=='b'?T:r=='ab'?[...O,...T]:r=='ba'?[...T,...O]:null,S=a=>a.map(t=>`<span>${esc('  '+t)}</span>`).join(''),
res='<span>async status(cwd: string) {</span>'+(ch?S(ch):`<span class="mk">&lt;&lt;&lt;&lt;&lt;&lt;&lt; ${m?'main':'origin/main'}</span>${S(O)}<span class="mk">=======</span>${S(T)}<span class="mk">&gt;&gt;&gt;&gt;&gt;&gt;&gt; ${m?'feature/diff-view':'7be02d4'}</span>`)+'<span>}</span>';
return ls+`<div class="col" style="flex:1"><div class="bar"><b class="mono">${f.n}</b><span class="chip t">UU</span>${sl}<span class="sp"></span>${bt('a','Взять левое')}${bt('b','Взять правое')}${bt('ab','Лево → право')}${bt('ba','Право → лево')}<button ${r&&!f.ok?'':'disabled'} onclick="CF[cfi].r=null;render()">Откатить</button>${mkb}</div>
<div class="cf mono"><div><h5>${L1}</h5><pre><span>async status(cwd: string) {</span><span class="o">${esc('  '+O[0])}</span><span class="o">${esc('  '+O[1])}</span><span>}</span></pre></div><div><h5 style="color:var(--pur)">${L2}</h5><pre><span>async status(cwd: string) {</span><span class="t">${esc('  '+T[0])}</span><span class="t">${esc('  '+T[1])}</span><span>}</span></pre></div><div><h5>Результат ${f.ok?'<span class="chip" style="color:var(--add)">решён</span>':ch?'':'<span class="chip" style="color:var(--del)">есть маркеры</span>'}</h5><pre>${res}</pre></div></div></div>`}
function mk(){const c=CF[cfi];c.ok=1;toast('git add '+c.n);const n=CF.findIndex(c=>!c.ok);if(n>=0)cfi=n;render()}
function render(k){side();bnr();$('#hb').textContent=br;$('#main').innerHTML=V=='hist'?hist():V=='chg'?chg():conf();const t=k==1?$('#msg'):k==2?$('#q'):0;if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
addEventListener('keydown',e=>{const c=e.ctrlKey||e.metaKey;if(c&&e.key=='k'){e.preventDefault();pal()}else if(e.key=='Escape')cl();else if(c&&'123'.includes(e.key)&&e.key.length==1){e.preventDefault();go(['hist','chg','conf'][e.key-1])}else if(c&&e.key=='Enter'&&V=='chg')cm()});
